<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Generator & Navigator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Maze Game</h1>
            <div class="control-group">
                <label for="maze-width">Width (10-100)</label>
                <input type="number" id="maze-width" value="20" min="10" max="100">
            </div>
            <div class="control-group">
                <label for="maze-height">Height (10-100)</label>
                <input type="number" id="maze-height" value="20" min="10" max="100">
            </div>
            <div class="control-group">
                <label for="maze-type">Maze Type</label>
                <select id="maze-type">
                    <option value="perfect">Satu Jalan (Tunggal)</option>
                    <option value="multiple">Banyak Jalan (Multiple)</option>
                </select>
            </div>
            <button id="generate-btn">Generate Maze</button>
            <div class="instructions">
                <h3>Controls:</h3>
                <p>Use <strong>Arrow Keys</strong> or <strong>W A S D</strong> to move.</p>
                <p>Find your way to the bottom right corner (Green Square).</p>
                <p id="status-message">Ready to play.</p>
            </div>
        </div>
        <div class="game-area">
            <canvas id="maze-canvas"></canvas>
            
            <div id="win-modal" class="modal hidden">
                <div class="modal-content">
                    <h2>Congratulations! 🎉</h2>
                    <p>You have solved the maze!</p>
                    <button id="play-again-btn">Play Again</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
